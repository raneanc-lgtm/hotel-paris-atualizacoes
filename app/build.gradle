plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slimcreative.sinucamobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.slimcreative.sinucalite"
        minSdk 24
        targetSdk 34
        // a automação do GitHub passa o número da compilação: cada APK novo instala por cima do anterior
        def numero = System.getenv("BUILD_NUMBER") ?: "1"
        versionCode = Integer.parseInt(numero)
        versionName = "1." + numero
    }

    // chave fixa do projeto: assim toda atualização instala por cima, sem precisar desinstalar
    signingConfigs {
        fixa {
            storeFile file("sinuca.keystore")
            storePassword "sinucamobile"
            keyAlias "sinuca"
            keyPassword "sinucamobile"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
        debug {
            signingConfig signingConfigs.fixa
        }
    }
    // verificação automática (lint) não pode barrar a compilação do APK
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
