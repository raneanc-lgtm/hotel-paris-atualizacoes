name: Gerar APK do Sinuca Mobile

on:
  push:
    branches: [ sinuca-mobile ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/SinucaMobile-1.${{ github.run_number }}.apk"

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SinucaMobile-1.${{ github.run_number }}
          path: saida/*.apk

      - name: Publicar para baixar (aba Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sinuca-mobile-1.${{ github.run_number }}
          name: Sinuca Mobile 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK do Sinuca Mobile (Slim Creative). Baixe o arquivo .apk abaixo e instale no celular.
            Cada versão nova instala por cima da anterior, sem perder fichas nem configurações.
          files: saida/*.apk
