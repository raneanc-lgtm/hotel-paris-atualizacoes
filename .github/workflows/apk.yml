name: Gerar APK do Sinuca Mobile

on:
  push:
    branches: [ sinuca-lite ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar o APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            # publica o motivo do erro como aviso (aparece no resumo da compilação)
            grep -E "error:|What went wrong|FAILURE|Exception|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/SinucaLite-1.${{ github.run_number }}.apk"

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SinucaLite-1.${{ github.run_number }}
          path: saida/*.apk

      - name: Publicar para baixar (aba Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sinuca-lite-1.${{ github.run_number }}
          name: Sinuca Lite 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK do Sinuca Lite (Slim Creative), versão leve só contra o computador. Baixe o arquivo .apk abaixo e instale no celular.
            Cada versão nova instala por cima da anterior, sem perder fichas nem configurações.
          files: saida/*.apk
